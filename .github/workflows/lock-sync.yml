name: Sync central package lock metadata

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  lock-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@silverfoxcloud"

      - name: Resolve exact central package metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print central package lock entries
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const names = ['@silverfoxcloud/web-tokens','@silverfoxcloud/web-fonts','@silverfoxcloud/web-locale','@silverfoxcloud/web-ui'];
          const out = {
            root: Object.fromEntries(Object.entries(lock.packages[''].dependencies || {}).filter(([k]) => names.includes(k))),
            packages: Object.fromEntries(Object.entries(lock.packages).filter(([k]) => names.some((n) => k.endsWith('node_modules/' + n))))
          };
          console.log('CENTRAL_LOCK_ENTRIES=' + JSON.stringify(out));
          NODE
