  <rect x="82" y="124" width="188" height="64" rx="14"/>
  <rect x="490" y="124" width="188" height="64" rx="14"/>
  <rect x="82" y="228" width="188" height="64" rx="14"/>
  <rect x="490" y="228" width="188" height="64" rx="14"/>
  <rect x="82" y="332" width="188" height="64" rx="14"/>
  <rect x="490" y="332" width="188" height="64" rx="14"/>
</g>
<g fill="#0f3553" stroke="#6bb8e5" stroke-width="2"><circle cx="380" cy="156" r="34"/><circle cx="380" cy="260" r="34"/><circle cx="380" cy="364" r="34"/></g>
<g fill="#eaf6ff" font-family="Inter,Arial,sans-serif">
  <text x="105" y="151" font-size="13" font-weight="700">OWNERSHIP</text><text x="105" y="171" font-size="10" fill="#87a5ba">responsibility before reuse</text>
  <text x="513" y="151" font-size="13" font-weight="700">CONTRACTS</text><text x="513" y="171" font-size="10" fill="#87a5ba">versioned boundaries</text>
  <text x="105" y="255" font-size="13" font-weight="700">SECURE DEFAULTS</text><text x="105" y="275" font-size="10" fill="#87a5ba">explicit privilege</text>
  <text x="513" y="255" font-size="13" font-weight="700">OBSERVABILITY</text><text x="513" y="275" font-size="10" fill="#87a5ba">explainable behavior</text>
  <text x="105" y="359" font-size="13" font-weight="700">EVOLUTION</text><text x="105" y="379" font-size="10" fill="#87a5ba">evidence before complexity</text>
  <text x="513" y="359" font-size="13" font-weight="700">RTL / LTR</text><text x="513" y="379" font-size="10" fill="#87a5ba">equal product modes</text>
</g>
