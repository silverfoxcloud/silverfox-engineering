<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
<title id="title">Silver Fox engineering principles</title>
<desc id="desc">Engineering principles connect ownership, contracts, secure defaults, observability and evidence-led evolution.</desc>
<rect width="760" height="520" rx="28" fill="#071421"/>
<path d="M108 104H652M108 416H652" stroke="#183750"/>
