<g fill="#17181a" font-family="Inter,Arial,sans-serif" text-anchor="middle"><text x="128" y="245" font-size="12" font-weight="700">INPUT</text><text x="128" y="269" font-size="9" fill="#5b61d6">data + context</text><text x="304" y="245" font-size="12" font-weight="700">INFERENCE</text><text x="304" y="269" font-size="9" fill="#5b61d6">bounded execution</text><text x="480" y="245" font-size="12" font-weight="700">EVALUATE</text><text x="480" y="269" font-size="9" fill="#5b61d6">quality + cost</text><text x="644" y="245" font-size="12" font-weight="700">OWNER</text><text x="644" y="269" font-size="9" fill="#5b61d6">human decision</text></g>
<g fill="#5b61d6"><circle cx="216" cy="260" r="4"/><circle cx="392" cy="260" r="4"/><circle cx="568" cy="260" r="4"/></g>
<rect x="239" y="367" width="282" height="74" rx="16" fill="#ffffff" stroke="#c9cdd3"/><text x="380" y="396" fill="#17181a" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle">OPERATIONAL FEEDBACK</text><text x="380" y="419" fill="#5b61d6" font-family="Inter,Arial,sans-serif" font-size="9" text-anchor="middle">traceability · drift · cost · failure modes</text>
