<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
<title id="title">AI evaluation and control flow</title><desc id="desc">A controlled AI workflow connects inputs, inference, evaluation, human ownership and operational feedback.</desc>
<style>
.trace{stroke-dasharray:10 10;animation:trace 8s linear infinite}.score{animation:score 4s ease-in-out infinite}
@keyframes trace{to{stroke-dashoffset:-80}}@keyframes score{50%{opacity:1;transform:scale(1.05)}}@media(prefers-reduced-motion:reduce){.trace,.score{animation:none}}
</style>
