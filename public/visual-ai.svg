<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
<title id="title">AI evaluation and control flow</title><desc id="desc">A controlled AI workflow connects inputs, inference, evaluation, human ownership and operational feedback.</desc>
