<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
<title id="title">Layered security boundaries</title><desc id="desc">Identity, authorization, tenant isolation and audit controls surround a protected workload.</desc>
<style>
.scan{animation:scan 5.2s ease-in-out infinite}.ring{animation:ring 4.6s ease-in-out infinite}
@keyframes scan{0%,100%{transform:translateY(-36px);opacity:.2}50%{transform:translateY(36px);opacity:1}}@keyframes ring{50%{stroke-opacity:.75}}
@media(prefers-reduced-motion:reduce){.scan,.ring{animation:none}}
</style>
<rect width="760" height="520" rx="28" fill="#071421"/>
<g fill="none" stroke="#24465f"><circle class="ring" cx="380" cy="260" r="194" stroke-opacity=".3"/><circle class="ring" cx="380" cy="260" r="148" stroke-opacity=".42"/><circle cx="380" cy="260" r="103" stroke="#3b6d8e"/></g>
<g fill="#0b2236" stroke="#315e7d" font-family="Inter,Arial,sans-serif" text-anchor="middle"><rect x="74" y="228" width="130" height="64" rx="14"/><rect x="278" y="58" width="204" height="64" rx="14"/><rect x="556" y="228" width="130" height="64" rx="14"/><rect x="278" y="398" width="204" height="64" rx="14"/></g>
<g fill="#ddecf7" font-family="Inter,Arial,sans-serif" text-anchor="middle"><text x="139" y="255" font-size="12" font-weight="700">IDENTITY</text><text x="139" y="274" font-size="9" fill="#7ea4bf">who is acting</text><text x="380" y="85" font-size="12" font-weight="700">AUTHORIZATION</text><text x="380" y="104" font-size="9" fill="#7ea4bf">least privilege</text><text x="621" y="255" font-size="12" font-weight="700">TENANCY</text><text x="621" y="274" font-size="9" fill="#7ea4bf">explicit isolation</text><text x="380" y="425" font-size="12" font-weight="700">AUDIT</text><text x="380" y="444" font-size="9" fill="#7ea4bf">evidence &amp; visibility</text></g>
<path d="M380 166L455 194V258C455 322 424 365 380 389C336 365 305 322 305 258V194L380 166Z" fill="#0e2c45" stroke="#70caef" stroke-width="2"/>
<circle cx="380" cy="268" r="33" fill="#081827" stroke="#5faed4"/><path d="M380 254V285" stroke="#e9f8ff" stroke-width="7" stroke-linecap="round"/><circle cx="380" cy="244" r="7" fill="#e9f8ff"/>
