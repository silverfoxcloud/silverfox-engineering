<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
<title id="title">Cloud infrastructure lifecycle</title><desc id="desc">Edge traffic flows through controlled ingress to workloads, delivery and observability layers.</desc>
<style>
.packet{animation:packet 4.8s ease-in-out infinite}.packet.b{animation-delay:1.4s}.pulse{animation:pulse 4s ease-in-out infinite}
@keyframes packet{0%{opacity:0;transform:translateX(-34px)}25%,70%{opacity:1}100%{opacity:0;transform:translateX(34px)}}@keyframes pulse{50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.packet,.pulse{animation:none}}
</style>
<rect width="760" height="520" rx="28" fill="#071421"/>
<g fill="none" stroke="#24465f"><path d="M78 92H682M78 428H682"/><path d="M128 58V462M632 58V462"/></g>
<g fill="#0b2236" stroke="#315e7d"><rect x="74" y="202" width="142" height="116" rx="18"/><rect x="282" y="72" width="196" height="96" rx="18"/><rect x="544" y="202" width="142" height="116" rx="18"/><rect x="282" y="350" width="196" height="96" rx="18"/></g>
<g fill="#ddecf7" font-family="Inter,Arial,sans-serif" text-anchor="middle"><text x="145" y="252" font-size="13" font-weight="700">EDGE</text><text x="145" y="275" font-size="10" fill="#7ea4bf">DNS · CDN · WAF</text><text x="380" y="117" font-size="13" font-weight="700">DELIVERY</text><text x="380" y="140" font-size="10" fill="#7ea4bf">build · config · deploy</text><text x="615" y="252" font-size="13" font-weight="700">WORKLOADS</text><text x="615" y="275" font-size="10" fill="#7ea4bf">services · jobs · data</text><text x="380" y="395" font-size="13" font-weight="700">OBSERVABILITY</text><text x="380" y="418" font-size="10" fill="#7ea4bf">logs · metrics · traces</text></g>
<rect x="290" y="207" width="180" height="106" rx="24" fill="#0e2c45" stroke="#6ac5ed" stroke-width="2"/>
<text x="380" y="250" fill="#eef9ff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="800" text-anchor="middle">PLATFORM</text><text x="380" y="278" fill="#8ec5e2" font-family="Inter,Arial,sans-serif" font-size="11" text-anchor="middle">repeatable environments</text>
<g stroke="#56a9d1" stroke-width="2" fill="none"><path d="M216 260H290"/><path d="M470 260H544"/><path d="M380 168V207"/><path d="M380 313V350"/></g>
