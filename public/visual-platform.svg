<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
<title id="title">Shared platform contracts</title><desc id="desc">Independent products consume shared identity, administration, licensing and payment capabilities through explicit contracts.</desc>
<style>
.flow{animation:flow 4.8s ease-in-out infinite}.flow.b{animation-delay:1.2s}.flow.c{animation-delay:2.4s}
@keyframes flow{0%,100%{opacity:.15}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}
</style>
<rect width="760" height="520" rx="28" fill="#f7f7f4"/>
<text x="60" y="70" fill="#5b61d6" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700">SHARED PLATFORM CONTRACTS</text>
<rect x="66" y="104" width="628" height="124" rx="22" fill="#ffffff" stroke="#c9cdd3"/>
<g fill="#ffffff" stroke="#5b61d6"><rect x="94" y="137" width="126" height="58" rx="12"/><rect x="242" y="137" width="126" height="58" rx="12"/><rect x="390" y="137" width="126" height="58" rx="12"/><rect x="538" y="137" width="126" height="58" rx="12"/></g>
<g fill="#17181a" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle"><text x="157" y="171">IDENTITY</text><text x="305" y="171">ADMIN</text><text x="453" y="171">LICENSE</text><text x="601" y="171">PAYMENTS</text></g>
<path d="M380 228V285" stroke="#5b61d6" stroke-width="2"/><circle class="flow" cx="380" cy="257" r="4" fill="#5b61d6"/>
<rect x="168" y="285" width="424" height="70" rx="18" fill="#ffffff" stroke="#5b61d6" stroke-width="2"/><text x="380" y="315" fill="#17181a" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" text-anchor="middle">VERSIONED CONTRACTS</text><text x="380" y="338" fill="#5b61d6" font-family="Inter,Arial,sans-serif" font-size="10" text-anchor="middle">stable interfaces · explicit boundaries</text>
<g stroke="#5b61d6" stroke-width="2"><path d="M250 355V396"/><path d="M380 355V396"/><path d="M510 355V396"/></g>
<g fill="#ffffff" stroke="#c9cdd3"><rect x="95" y="396" width="190" height="68" rx="14"/><rect x="285" y="396" width="190" height="68" rx="14"/><rect x="475" y="396" width="190" height="68" rx="14"/></g>
<g fill="#17181a" font-family="Inter,Arial,sans-serif" text-anchor="middle"><text x="190" y="425" font-size="11" font-weight="700">PRODUCT A</text><text x="190" y="445" font-size="9" fill="#5b61d6">independent release</text><text x="380" y="425" font-size="11" font-weight="700">PRODUCT B</text><text x="380" y="445" font-size="9" fill="#5b61d6">independent release</text><text x="570" y="425" font-size="11" font-weight="700">PRODUCT C</text><text x="570" y="445" font-size="9" fill="#5b61d6">independent release</text></g>
<g fill="#5b61d6"><circle class="flow b" cx="250" cy="378" r="4"/><circle class="flow c" cx="380" cy="378" r="4"/><circle class="flow" cx="510" cy="378" r="4"/></g>
</svg>